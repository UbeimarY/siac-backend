# Despliegue en un servidor Ubuntu (numeral 2.5.4): PostgreSQL + API Django.
# Uso: cp .env.example .env  (completar)  &&  docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siac}
      POSTGRES_USER: ${POSTGRES_USER:-siac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siac}"]
      interval: 10s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-siac}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siac}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  media:
